<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DataMatrix Scanner</title>
<style>
body { font-family: sans-serif; text-align: center; background: #222831; color: #EEEEEE; }
video { width: 90%; max-width: 400px; margin-top: 20px; border: 2px solid #00ADB5; }
input, button { font-size: 18px; margin-top: 10px; padding: 8px; width: 80%; max-width: 300px; }
button { background: #00ADB5; color: #222831; border: none; cursor: pointer; }
</style>
</head>
<body>
<h2>Сканер DataMatrix</h2>
<video id="video" autoplay></video><br>
<input id="phone" placeholder="+71234567890" /><br>
<button id="sendBtn">Отправить</button>

<script src="https://unpkg.com/@zxing/library@0.19.0/umd/index.min.js"></script>
<script>
const codeReader = new ZXing.BrowserDatamatrixCodeReader();
const video = document.getElementById('video');
const phoneInput = document.getElementById('phone');
const sendBtn = document.getElementById('sendBtn');
let scannedCode = null;

// Запуск камеры
navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
  .then(stream => { video.srcObject = stream; })
  .catch(err => alert("Ошибка камеры: " + err));

// Сканирование DataMatrix
codeReader.decodeFromVideoDevice(null, video, (result, err) => {
  if (result) {
    scannedCode = result.text;
    alert("Код найден: " + scannedCode);
    video.srcObject.getTracks().forEach(track => track.stop());
  }
});

// Отправка данных боту
sendBtn.onclick = () => {
  const phone = phoneInput.value.trim();
  if (!scannedCode) return alert("Сначала сканируйте код!");
  if (!/^\+?\d{10,15}$/.test(phone)) return alert("Неверный формат телефона");
  Telegram.WebApp.sendData(JSON.stringify({ code: scannedCode, phone }));
}
</script>
</body>
</html>
