<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>DataMatrix Scanner</title>
<style>
body {
    font-family: sans-serif;
    text-align: center;
    background: #222831;
    color: #EEEEEE;
}
video {
    width: 90%;
    max-width: 400px;
    margin-top: 20px;
    border: 2px solid #00ADB5;
}
input, button {
    font-size: 18px;
    margin-top: 10px;
    padding: 8px;
    width: 80%;
    max-width: 300px;
}
button {
    background: #00ADB5;
    color: #222831;
    border: none;
    cursor: pointer;
}
#output {
    color: #00ADB5;
    margin-top: 15px;
    white-space: pre-wrap;
}
</style>
</head>
<body>

<h2>Сканер DataMatrix</h2>
<button id="startBtn">Запустить камеру</button><br>
<video id="video" autoplay playsinline></video><br>
<input id="phone" placeholder="+71234567890" /><br>
<button id="sendBtn">Подготовить данные</button>

<pre id="output"></pre>

<script src="https://unpkg.com/@zxing/library@0.19.0/umd/index.min.js"></script>
<script>
let scannedCode = null;
const video = document.getElementById('video');
const startBtn = document.getElementById('startBtn');
const sendBtn = document.getElementById('sendBtn');
const phoneInput = document.getElementById('phone');
const output = document.getElementById('output');
const codeReader = new ZXing.BrowserDatamatrixCodeReader();

// Функция запуска камеры по клику
startBtn.onclick = async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("Камера не поддерживается этим устройством");
        return;
    }

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        startBtn.style.display = "none"; // скрываем кнопку после старта камеры
        scanCode();
    } catch(err) {
        alert("Ошибка доступа к камере: " + err);
        console.error(err);
    }
};

// Функция сканирования DataMatrix
function scanCode() {
    codeReader.decodeFromVideoDevice(null, video, (result, err) => {
        if (result && !scannedCode) {
            scannedCode = result.text;
            alert("Код найден: " + scannedCode);
            // останавливаем камеру после сканирования
            video.srcObject.getTracks().forEach(track => track.stop());
        }
    });
}

// Подготовка JSON для бота
sendBtn.onclick = () => {
    const phone = phoneInput.value.trim();
    if (!scannedCode) return alert("Сначала сканируйте код!");
    if (!/^\+?\d{10,15}$/.test(phone)) return alert("Неверный формат телефона");

    const data = { code: scannedCode, phone };
    output.textContent = JSON.stringify(data, null, 2);
    console.log("Готовые данные для бота:", data);
    alert("Данные готовы! Проверьте консоль или скопируйте JSON ниже.");
};
</script>

</body>
</html>
