<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тест камеры</title>
<style>
body {
    font-family: sans-serif;
    text-align: center;
    margin-top: 50px;
    background: #222831;
    color: #EEEEEE;
}
video {
    width: 90%;
    max-width: 400px;
    border: 2px solid #00ADB5;
}
button {
    font-size: 18px;
    margin-top: 20px;
    padding: 10px 20px;
    background: #00ADB5;
    color: #222831;
    border: none;
    cursor: pointer;
}
</style>
</head>
<body>

<h2>Тест камеры</h2>
<button id="startBtn">Запустить камеру</button><br>
<video id="video" autoplay playsinline></video>

<script>
const startBtn = document.getElementById('startBtn');
const video = document.getElementById('video');

startBtn.onclick = async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert("Камера не поддерживается этим устройством");
        return;
    }

    try {
        // Запрашиваем доступ к камере (задняя камера)
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        video.play();
        startBtn.style.display = "none"; // скрываем кнопку после старта камеры
    } catch(err) {
        alert("Ошибка доступа к камере: " + err);
        console.error(err);
    }
};
</script>

</body>
</html>
